# Checks every push to main and every pull request on a clean machine (decision 017).
name: CI

on:
   push:
      branches: [main]
   pull_request:

# No permissions unless a job asks for them (least privilege).
permissions: {}

# A newer push to the same pull request cancels the older run.
# On main every commit gets its own run, so each one is checked.
concurrency:
   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
   cancel-in-progress: true

env:
   TURBO_TELEMETRY_DISABLED: 1

jobs:
   lint:
      name: Lint, format and types
      runs-on: ubuntu-latest
      timeout-minutes: 10
      permissions:
         contents: read
      steps:
         - name: Check out the code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
         - name: Install pnpm (version from package.json)
           uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
         - name: Install Node (version from .nvmrc)
           uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
           with:
              node-version-file: .nvmrc
              cache: pnpm
         - name: Install dependencies
           run: pnpm install --frozen-lockfile
         - name: Check formatting
           run: pnpm format:check
         - name: Lint
           run: pnpm lint --deny-warnings
         - name: Typecheck
           run: pnpm typecheck

   test:
      name: Tests
      runs-on: ubuntu-latest
      timeout-minutes: 10
      permissions:
         contents: read
      steps:
         - name: Check out the code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
         - name: Install pnpm (version from package.json)
           uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
         - name: Install Node (version from .nvmrc)
           uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
           with:
              node-version-file: .nvmrc
              cache: pnpm
         - name: Install dependencies
           run: pnpm install --frozen-lockfile
         - name: Test with coverage
           run: pnpm test

   audit:
      name: Dependency audit
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
         contents: read
      steps:
         - name: Check out the code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
         - name: Install pnpm (version from package.json)
           uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
         - name: Install Node (version from .nvmrc)
           uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
           with:
              node-version-file: .nvmrc
         # Reads pnpm-lock.yaml only, so no install is needed.
         - name: Audit dependencies
           run: pnpm audit
