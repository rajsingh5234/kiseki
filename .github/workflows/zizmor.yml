# Checks our workflow files for security problems with zizmor (decision 017).
# Findings appear in the repo's Security tab and as a "Code scanning" check on pull requests.
name: zizmor

on:
   push:
      branches: [main]
      paths: [".github/**"]
   # No path filter here: a required check must report on every pull request, or it waits forever.
   pull_request:

permissions: {}

concurrency:
   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
   cancel-in-progress: true

jobs:
   zizmor:
      name: Workflow security
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions:
         security-events: write # upload the findings to the Security tab
      steps:
         - name: Check out the code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
           with:
              persist-credentials: false
         - name: Scan the workflows
           uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
           with:
              # Pinned too: by default the action downloads the newest zizmor on every run.
              version: 1.32.0
